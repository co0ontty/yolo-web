services:
  app:
    image: vibe-coding:latest
    ports:
      # - "8118:80"   # HTTP 重定向到 HTTPS
      - "8443:443"  # HTTPS 端口
      # - "3100:3100"  # 调试时可开启，直接访问 Go server
    volumes:
      - server-data:/app/data
      - ./server/certs:/app/certs  # SSL 证书目录，默认自签名证书
    environment:
      # Web 认证配置 (可选)
      # 启用认证：设置 WEB_AUTH_ENABLED=true 并配置用户名密码
      # 认证由应用层 (Go server) 处理，不再是 nginx 基本认证
      - WEB_AUTH_ENABLED=${WEB_AUTH_ENABLED:-false}
      - WEB_AUTH_USER=${WEB_AUTH_USER:-admin}
      - WEB_AUTH_PASSWORD=${WEB_AUTH_PASSWORD:-}
      # 其他配置
      - PORT=3100
      - CLAUDE_TOKEN=${CLAUDE_TOKEN:-}
      # 会话存储后端 (sqlite 或 json，sqlite 在 Docker 中可能有 CGO 问题)
      - SESSION_STORE_BACKEND=json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3100/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  server-data:
